# Runs the benchmark on models served by Groq's free API tier, a little every
# day. The free tier limits tokens and requests per model and per day, so each
# run continues where the last one stopped (--resume) and moves on to the next
# model when one reaches its daily limit. Results are saved to the
# `groq-results` branch.
#
# Models run in the order of MODELS. Each is first checked with one tool call
# (scripts/check_api.py); a model Groq does not serve, or a setting it rejects,
# is skipped with a warning, so one missing model never stops the others. Each
# model gets at most MINUTES_PER_MODEL minutes per run, so every model makes
# progress. For each model the case sets run in the order of CASE_SETS; a set
# that is finished makes no model calls.
#
# Setup (once): add the API key as a repository secret named GROQ_API_KEY
# (Settings > Secrets and variables > Actions > New repository secret).
# Start a run by hand: Actions > Groq model run > Run workflow.

name: Groq model run

on:
  schedule:
    - cron: "41 */6 * * *" # every 6 hours; a run stops as soon as the limits are reached
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: groq-run
  cancel-in-progress: false

env:
  BASE_URL: https://api.groq.com/openai/v1
  # One model per line: model id | extra API settings (JSON) | results folder |
  # reply token cap | defences (in this order; the most important first).
  # GPT-OSS-120B at low reasoning effort is the reported run (done on the main
  # and message-payee sets). Medium effort spends more tokens on reasoning, so
  # its replies get a higher cap and their own folder (the run names would
  # otherwise be the same). Qwen3 runs without its thinking mode, like the
  # Qwen2.5 models. Models after the first are newer or other families.
  MODELS: |
    openai/gpt-oss-120b|{"reasoning_effort": "low"}|results_groq|1024|none provenance-amount provenance
    openai/gpt-oss-120b|{"reasoning_effort": "medium"}|results_groq_medium|4096|none provenance-amount
    openai/gpt-oss-20b|{"reasoning_effort": "low"}|results_groq|1024|none provenance-amount
    qwen/qwen3-32b|{"reasoning_effort": "none"}|results_groq|1024|none provenance-amount
    meta-llama/llama-4-scout-17b-16e-instruct|{}|results_groq|1024|none provenance-amount
    moonshotai/kimi-k2-instruct-0905|{}|results_groq|1024|none provenance-amount
  # cases folder:suffix of the results folder, one pair per case set, in this order.
  CASE_SETS: >-
    bench/cases:
    bench/cases_message_payee:_message_payee
    bench/cases_third_party:_third_party
  MINUTES_PER_MODEL: 50
  RESULTS_BRANCH: groq-results

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Get the results saved so far
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" "$RESULTS_BRANCH" >/dev/null; then
            git clone --quiet --branch "$RESULTS_BRANCH" --single-branch "$REPO_URL" /tmp/saved
            for d in /tmp/saved/results_groq*; do
              if [ -d "$d" ]; then cp -r "$d" .; fi
            done
          else
            mkdir -p /tmp/saved && (cd /tmp/saved && git init --quiet -b "$RESULTS_BRANCH" && git remote add origin "$REPO_URL")
          fi
          for f in results_groq*/*/scores.jsonl; do [ -f "$f" ] && echo "$(wc -l < "$f") cases: $f"; done; true

      - name: Run each model until done, its daily limit or its time for this run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then echo "Add the GROQ_API_KEY repository secret first."; exit 1; fi
          set +e
          while IFS='|' read -r model extra prefix max_tokens defences; do
            [ -z "$model" ] && continue
            echo "::group::$model $extra"
            python scripts/check_api.py --model "$model" --base-url "$BASE_URL" --api-key-env GROQ_API_KEY \
              --extra-body "$extra" --max-tokens "$max_tokens" < /dev/null
            code=$?
            if [ $code -eq 3 ]; then echo "$model: daily limit reached; the next run continues."; echo "::endgroup::"; continue; fi
            if [ $code -ne 0 ]; then
              echo "::endgroup::"
              echo "::warning::$model $extra skipped: Groq does not serve it, or rejects this setting (see the check above)."
              continue
            fi
            deadline=$(( $(date +%s) + MINUTES_PER_MODEL * 60 ))
            stop=""
            for set in $CASE_SETS; do
              cases="${set%%:*}"; out="${prefix}${set#*:}"
              for d in $defences; do
                left=$(( deadline - $(date +%s) ))
                if [ $left -le 60 ]; then stop="time"; break 2; fi
                timeout "$left" python scripts/run_bench.py --model "$model" --base-url "$BASE_URL" \
                  --api-key-env GROQ_API_KEY --extra-body "$extra" --max-tokens "$max_tokens" --defence "$d" \
                  --cases "$cases" --out "$out" --resume --workers 2 < /dev/null
                code=$?
                if [ $code -eq 3 ]; then stop="daily limit, during $cases, $d"; break 2; fi
                if [ $code -eq 124 ]; then stop="time"; break 2; fi
                if [ $code -ne 0 ]; then stop="error (exit code $code), during $cases, $d"; break 2; fi
              done
            done
            echo "::endgroup::"
            case "$stop" in
              "") echo "$model $extra: every case set done." ;;
              error*) echo "::warning::$model $extra stopped by an $stop." ;;
              *) echo "$model $extra: stopped for this run ($stop); the next run continues." ;;
            esac
          done <<< "$MODELS"
          exit 0

      - name: Save results to the ${{ env.RESULTS_BRANCH }} branch
        if: always()
        run: |
          for d in results_groq*; do
            if [ -d "$d" ]; then rm -rf "/tmp/saved/$d" && cp -r "$d" /tmp/saved/; fi
          done
          cd /tmp/saved
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No new results"; exit 0; fi
          for f in results_groq*/*/scores.jsonl; do echo "$(wc -l < "$f") cases: $f"; done
          git commit --quiet -m "Groq results, $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push --quiet origin "$RESULTS_BRANCH"
